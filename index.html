<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>STORY ARCHIVE | アイデア一覧</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#252936;background:#f7f7f9}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:20px max(20px,calc((100vw - 850px)/2));font-weight:700;letter-spacing:.04em}main{max-width:850px;margin:auto;padding:32px 18px 70px}h1{font-size:1.65rem;margin:0 0 8px}.hint{color:#667085;font-size:.88rem;line-height:1.7}.controls{display:flex;gap:10px;margin:26px 0 18px}input,select{border:1px solid #d4d7df;border-radius:10px;background:white;padding:12px;font:inherit;min-width:0}input{flex:1}select{max-width:135px}.card{display:block;width:100%;text-align:left;background:white;border:1px solid #e5e7eb;border-radius:14px;padding:19px;margin:10px 0;color:inherit;cursor:pointer}.card:focus-visible,.back:focus-visible{outline:3px solid #5e77d3}.card strong{display:block;margin:9px 0;font-size:1.05rem}.card p{color:#667085;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:.75rem;color:#697586}.empty{background:white;border:1px dashed #cdd1d9;border-radius:14px;padding:34px 20px;text-align:center;color:#667085;line-height:1.8}.back{border:0;background:none;color:#365fbb;font:inherit;padding:0 0 20px;cursor:pointer}.paper{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:24px;overflow-wrap:anywhere}.paper h2{margin:12px 0 22px}.original{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font-size:1rem}.error{color:#b42318}.hidden{display:none}@media(max-width:520px){main{padding-top:25px}.controls{flex-wrap:wrap}input{flex-basis:100%}select{max-width:none;width:100%}}
</style></head><body><header>STORY ARCHIVE</header><main>
<section id="listing"><h1>アイデア一覧</h1><p class="hint">思いついたことを、原文のまま蓄積する場所。</p><div class="controls"><input id="search" type="search" placeholder="アイデアを検索" aria-label="アイデアを検索"><select id="sort" aria-label="並び順"><option value="new">新しい順</option><option value="old">古い順</option></select></div><p id="count" class="hint"></p><div id="cards" aria-live="polite"></div></section>
<section id="detail" class="hidden"><button class="back" id="back" type="button">← アイデア一覧に戻る</button><article class="paper"><span id="detail-meta" class="meta"></span><h2 id="detail-title"></h2><div id="detail-original" class="original"></div></article></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
let records=[];
const safeId=id=>/^IDEA-\d{4,}$/.test(id);
function listView(){ $('detail').classList.add('hidden');$('listing').classList.remove('hidden');history.replaceState(null,'',location.pathname+location.search);render(); }
function render(){const q=$('search').value.toLocaleLowerCase();const filtered=records.filter(x=>(x.id+' '+x.title+' '+x.original).toLocaleLowerCase().includes(q)).sort((a,b)=>$('sort').value==='new'?b.id.localeCompare(a.id):a.id.localeCompare(b.id));$('count').textContent=filtered.length+' 件のアイデア';$('cards').replaceChildren();if(!filtered.length){const div=document.createElement('div');div.className='empty';div.textContent=records.length?'該当するアイデアはありません。':'まだアイデアが登録されていません。';$('cards').append(div);return;}for(const x of filtered){const button=document.createElement('button');button.className='card';button.type='button';const meta=document.createElement('span');meta.className='meta';meta.textContent=x.id;const strong=document.createElement('strong');strong.textContent=x.title||'無題のアイデア';const p=document.createElement('p');p.textContent=x.original;button.append(meta,strong,p);button.addEventListener('click',()=>showDetail(x.id));$('cards').append(button);}}
function showDetail(id){const x=records.find(v=>v.id===id);if(!x)return;$('listing').classList.add('hidden');$('detail').classList.remove('hidden');$('detail-meta').textContent=x.id;$('detail-title').textContent=x.title||'無題のアイデア';$('detail-original').textContent=x.original;history.replaceState(null,'','#'+id);window.scrollTo(0,0);}
async function init(){try{const response=await fetch('./data/index.json',{cache:'no-store'});if(!response.ok)throw Error('一覧データを取得できません');const index=await response.json();if(!Array.isArray(index.ids)||index.ids.some(id=>!safeId(id)))throw Error('一覧データの形式が不正です');const results=await Promise.all(index.ids.map(async id=>{const r=await fetch('./data/ideas/'+id+'.json',{cache:'no-store'});if(!r.ok)throw Error(id+' の取得に失敗しました');const x=await r.json();if(x.id!==id||typeof x.original!=='string'||typeof x.title!=='string')throw Error(id+' の形式が不正です');return x;}));records=results;render();const id=decodeURIComponent(location.hash.slice(1));if(safeId(id))showDetail(id);}catch(e){const div=document.createElement('div');div.className='empty error';div.textContent='読み込みエラー: '+e.message;$('cards').replaceChildren(div);}}
$('search').addEventListener('input',render);$('sort').addEventListener('change',render);$('back').addEventListener('click',listView);window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if(safeId(id))showDetail(id);else listView();});init();
</script></body></html>
